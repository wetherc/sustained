[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "sustained"
version = "2.25.0"
description = "A Python ORM, SQL query builder, and schema migration tool, inspired by Objection.js and Knex"
readme = "README.md"
requires-python = ">=3.9"
keywords = [ "orm", "sql", "query builder", "schema migrations", "database migrations", "migration tool", "objection.js", "knex", "postgresql", "mysql", "mariadb", "sql server", "mssql", "sqlite", "duckdb", "athena", "presto", "asyncpg", "aiosqlite",]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: SQL",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
license = "MIT"
license-files = [ "LICENSE",]
[[project.authors]]
name = "Christopher Wetherill"
email = "git@tbmh.org"

[project.scripts]
sustained = "sustained.cli:main"

[project.urls]
Homepage = "https://sustained.tbmh.org"
Documentation = "https://sustained.tbmh.org"
Changelog = "https://sustained.tbmh.org/changelog"
Source = "https://github.com/wetherc/sustained"
Issues = "https://github.com/wetherc/sustained/issues"

[tool.isort]
profile = "black"

# Ruff only checks function size and complexity; black and isort own the
# formatting. Each limit sits at the worst function in src/ today, so a
# new function cannot be worse than any we already have. Lower a limit
# when the function that sets it is broken up.
[tool.ruff.lint]
select = [ "C901", "PLR0912", "PLR0913", "PLR0915",]

[tool.ruff.lint.mccabe]
max-complexity = 27

[tool.ruff.lint.pylint]
max-branches = 26
max-args = 14
max-statements = 93

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
strict = true
check_untyped_defs = true
exclude = [ "build/", "venv/",]

[tool.hatch.build]
dev-mode-dirs = [ "src",]

# Hatchling reads only .gitignore, so a build in a working tree would pack
# files excluded some other way, such as through .git/info/exclude.
[tool.hatch.build.targets.sdist]
include = [ "/src", "/tests", "/support.json", "/CHANGELOG.md",]

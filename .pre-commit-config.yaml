# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        name: isort (python)

  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        files: ^src/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v1.19.1"
    hooks:
      - id: mypy
        pass_filenames: false
        always_run: true
        args: ["-p", "sustained", "--strict", "--check-untyped-defs"]

  - repo: local
    hooks:
      - id: sync-changelog
        name: Check the docs changelog matches CHANGELOG.md
        entry: python3 sync_changelog.py --check
        language: system
        files: ^(CHANGELOG\.md|docs/changelog\.md|sync_changelog\.py)$
        pass_filenames: false

      - id: sync-support
        name: Check the support page matches support.json
        entry: python3 sync_support.py --check
        language: system
        files: ^(support\.json|docs/support\.md|sync_support\.py|docker/compose\.yaml)$
        pass_filenames: false

      - id: unit-tests
        name: Run unit tests with coverage
        entry: >
          bash -c "PY=python3; [ -x .venv/bin/python ] && PY=.venv/bin/python;
          PYTHONPATH=src $PY -m coverage run --branch
          --source=src/sustained -m unittest discover -s tests
          && $PY -m coverage report --fail-under=90 > /dev/null"
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
